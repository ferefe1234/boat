name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pip install Pillow==12.3.0
      - run: python build/prepare-assets.py
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build installable test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Package corresponding source
        run: git archive --format=zip --output=QRtransfer-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: QRtransfer-Android7-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            QRtransfer-source.zip
          if-no-files-found: error
